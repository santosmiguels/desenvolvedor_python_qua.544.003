<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segundo programa em Python com Flask - IMC (Índice de Massa Corporal).</title>
</head>
<body>
    <h1>Aula do dia 11/09/2026</h1>
    <h2>Segundo programa em Python com Flask - IMC (Índice de Massa Corporal)</h2>
    <form action="/imc" method="POST">
        <label for="nome">Informe o seu nome:</label><br>
        <input type="text" name="nome" required><br><br>
        <label for="massa">Informe sua massa muscular em KG:</label><br>
        <input type="number" step="0.01" name="massa" required><br><br>
        <label type="altura">Informe a sua altura em metros:</label><br>
        <input typr="number" step="0.01" name="altura" required><br><br>
        <button type="submit">Calcular</button> 
    </form>

    <hr>
    <H2>Resultado:</H2>
    <h2>{{result if result else ""}}</h2>
    <hr>
    
</body>
</html>
