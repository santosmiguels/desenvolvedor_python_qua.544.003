<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terceiro programa em Python com Flask.</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontes.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
    <h1>Terceiro programa em Python com Flask no curso do SENAI.</h1>
    <h2>Bem vindo, {{nome}}.</h2>
    <h3>Imagem de natureza mostrada pelo html:</h3>
    <img src="/static/img/nat1.jpg" alt="Imagens da natureza01." width="300">
    <img src="/static/img/nat2.jpg" alt="Imagens da natureza01." width="300">
    <h3>Imagem da natureza mostrada pelo python com flask:</h3>
    <img src="{{ url_for('static', filename='img/cidade1.jpg')}}" alt="Imagem da cidade1 RJ." width="300">
    <img src="{{ url_for('static', filename='img/cidade2.jpg')}}" alt="Imagem da cidade2 RJ." width="300">
    <img src="{{url_for('static', filename='img/cidade3.jpg')}}" alt="Imagem da cidade3 RJ." width="300">    
</body>
</html>
